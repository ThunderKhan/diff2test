name: cli-ergonomics-pass

on:
  push:
    branches: [cli-ergonomics]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin cli-ergonomics
          git checkout -B cli-ergonomics origin/cli-ergonomics

      - name: Apply refactor
        run: |
          python3 tools/cli_refactor.py
          clang-format -i diff2test.cpp
          git diff --check

      - name: Build and unit test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Verify shorthand and legacy equivalence
        shell: bash
        run: |
          cmake -E make_directory fixture/build/.cmake/api/v1/query
          cmake -E touch fixture/build/.cmake/api/v1/query/codemodel-v2
          cmake -S fixture -B fixture/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build fixture/build --parallel 2
          ctest --test-dir fixture/build --show-only=json-v1 > fixture/build/ctest-info.json
          find fixture/build -type f -name '*.o.d' -printf '%P\n' | sort > fixture/build/deps.txt
          printf 'include/alpha.hpp\n' > fixture/changed.txt

          explicit=$(build/diff2test analyze --project-root "$(pwd)/fixture" --build-root "$(pwd)/fixture/build" --changed-files fixture/changed.txt --cmake-reply fixture/build/.cmake/api/v1/reply --ctest-info fixture/build/ctest-info.json --dep-list fixture/build/deps.txt --format names)
          shorthand=$(printf 'include/alpha.hpp\n' | build/diff2test analyze "$(pwd)/fixture" --format names)
          alias_form=$(printf 'include/alpha.hpp\n' | build/diff2test analyze "$(pwd)/fixture" --build "$(pwd)/fixture/build" --format names)
          file_override=$(build/diff2test analyze "$(pwd)/fixture" --changed-files fixture/changed.txt --format names)
          test "$explicit" = 'AlphaTest'
          test "$shorthand" = "$explicit"
          test "$alias_form" = "$explicit"
          test "$file_override" = "$explicit"

          set +e
          printf 'include/alpha.hpp\n' | build/diff2test analyze "$(pwd)/fixture" --ctest-info fixture/build/missing.json --format names >/tmp/missing.out 2>/tmp/missing.err
          missing_status=$?
          build/diff2test analyze . --project-root . >/dev/null 2>/tmp/root.err
          root_status=$?
          build/diff2test analyze . --build build --build-root build >/dev/null 2>/tmp/build.err
          build_status=$?
          set -e
          test "$missing_status" -eq 11
          test ! -s /tmp/missing.out
          grep -q 'FULL_SUITE_REQUIRED: CTest catalogue not found at' /tmp/missing.err
          test "$root_status" -eq 64
          test "$build_status" -eq 64

      - name: Audit runtime subprocess APIs
        shell: bash
        run: |
          ! grep -nE '\b(system|popen|pclose|fork|exec[lvpe]*|posix_spawn)\s*\(' diff2test.cpp

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diff2test.cpp
          git commit -m 'feat: simplify analyze CLI defaults'
          git push origin HEAD:cli-ergonomics
